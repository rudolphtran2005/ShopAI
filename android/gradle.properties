# Project-wide Gradle settings.

# Specifies the JVM arguments used for the daemon process.
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8

# Tăng tốc build: giữ daemon, cache và chạy song song các module
org.gradle.daemon=true
org.gradle.caching=true
org.gradle.parallel=true
org.gradle.configureondemand=true

# Chỉ build kiến trúc của emulator khi học (máy thật dùng arm64-v8a)
reactNativeArchitectures=x86_64

# AndroidX
android.useAndroidX=true

# New Architecture, Hermes, edge-to-edge
newArchEnabled=true
hermesEnabled=true
edgeToEdgeEnabled=true

# AGP 9 opt-out (giữ nguyên theo template)
android.builtInKotlin=false
android.newDsl=false